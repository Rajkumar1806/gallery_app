name: gallery_app
description: A gallery photo app.
publish_to: 'none'
version: 1.0.0+1

# The code uses Dart 3 records (`(IconData, String, String)`), switch
# expressions and patterns, so Dart >= 3.0 is mandatory (3.6+ recommended).
environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # --- media access -------------------------------------------------------
  photo_manager: ^3.6.0
  photo_manager_image_provider: ^2.2.0

  # --- viewer / sharing / video ------------------------------------------
  photo_view: ^0.15.0
  video_player: ^2.9.2
  share_plus: ^10.1.2

  # --- on-device smart tags + face detection (no cloud) -------------------
  google_mlkit_image_labeling: ^0.13.0
  google_mlkit_face_detection: ^0.12.0

  # --- places (reverse geocoding of photo GPS) ----------------------------
  geocoding: ^3.0.0

  # --- local caches / favourites -----------------------------------------
  shared_preferences: ^2.3.3
  path_provider: ^2.1.5
  intl: ^0.20.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
